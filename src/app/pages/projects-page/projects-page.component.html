<!-- Projects -->
<section id="projects" class="h-screen scroll-snap-start flex flex-col items-center justify-center bg-gray-900 text-textPrimary px-4">
  <h2 class="text-3xl font-bold text-accent my-8">Projects</h2>
  <div class="bg-cardBg w-full sm:w-[95%] md:w-[85%] lg:w-[75%] rounded-xl relative py-6 px-4 shadow-lg shadow-gray-600">
    <div class="absolute top-1/2 transform -translate-y-1/2 w-full hidden md:flex justify-between px-2">
      <span class="font-bold md:text-xl cursor-pointer text-secondary hover:text-white transition duration-300" (click)="previousProject()">
        <i class="bi bi-arrow-left"></i>
      </span>
      <span class="font-bold md:px-4 md:text-xl cursor-pointer text-secondary hover:text-white transition duration-300" (click)="nextProject()">
        <i class="bi bi-arrow-right"></i>
      </span>
    </div>

    <div class="flex flex-col-reverse md:flex-row items-center justify-around mt-8">
        <div class="text-left md:text-center w-full md:w-[45%] px-4 text-textPrimary">
            <h3 class="text-xl sm:text-2xl font-bold mb-4">{{ projects[currentIndex].title }}</h3>
            <p class="mb-4 text-sm sm:text-base md:text-lg leading-relaxed">{{ projects[currentIndex].problem }}</p>
            <p class="mb-4 text-sm sm:text-base md:text-lg leading-relaxed">{{ projects[currentIndex].solution }}</p>
            <ul class="list-disc list-inside mb-4 text-sm sm:text-base md:text-lg">
              <li *ngFor="let feature of projects[currentIndex].keyFeatures">{{ feature }}</li>
            </ul>
            <p class="mb-4 text-sm sm:text-base md:text-lg leading-relaxed">Tech Stack: {{ projects[currentIndex].tech.join(', ') }}</p>
            <a [href]="projects[currentIndex].link" target="_blank" class="inline-block bg-accent hover:bg-red-600 px-6 py-2 rounded-full text-white font-semibold shadow-md">
            {{ projects[currentIndex].btnText }}
            </a>
        </div>
        <div class="w-full md:w-[45%] mb-6 md:mb-0">
            <img [src]="projects[currentIndex].image" loading="lazy" [alt]="projects[currentIndex].title" class="rounded-lg shadow-md w-[90%] md:w-full mx-auto">
        </div>
    </div>

    <div class="flex justify-center mt-6 space-x-4">
      <span *ngFor="let project of projects; let i = index"
            class="w-3 h-3 rounded-full cursor-pointer transition-all duration-300 hover:bg-accent"
            [ngClass]="{'bg-white opacity-50': i !== currentIndex, 'bg-accent scale-110': i === currentIndex}"
            (click)="goToProject(i)">
      </span>
    </div>
  </div>
</section>
