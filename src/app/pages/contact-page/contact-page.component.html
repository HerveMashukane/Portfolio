<!-- Contact -->
<section id="contact" class="min-h-screen flex flex-col items-center justify-center bg-gray-800 px-4 py-12 scroll-snap-start">
  <h2 class="text-3xl font-bold text-accent mb-6">Contact</h2>

  <form 
    [formGroup]="contactForm" 
    (ngSubmit)="submitForm()" 
    class="w-full sm:w-[80%] md:w-[50%] lg:w-[40%] bg-cardBg shadow-lg shadow-gray-600 rounded-xl p-6 space-y-5"
  >
    <div class="flex flex-col">
      <label class="mb-1 font-bold text-textPrimary">Your Name</label>
      <input type="text" formControlName="name" placeholder="e.g. Hervé Mashukane" 
        class="text-textPrimary border border-gray-600 bg-primary/90 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-secondary transition duration-200">
      <span *ngIf="name?.touched && name?.invalid" class="text-red-500 text-sm mt-1">Name is required</span>
    </div>

    <div class="flex flex-col">
      <label class="mb-1 font-bold text-textPrimary">Your Email</label>
      <input type="email" formControlName="email" placeholder="e.g. hervemashukane@gmail.com" 
        class="text-textPrimary border border-gray-600 bg-primary/90 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-secondary transition duration-200">
      <span *ngIf="email?.touched && email?.invalid" class="text-red-500 text-sm mt-1">
        {{ email?.errors?.['required'] ? 'Email is required' : email?.errors?.['pattern'] ? 'Enter a valid email' : '' }}
      </span>
    </div>

    <div class="flex flex-col">
      <label class="mb-1 font-bold text-textPrimary">Message</label>
      <textarea formControlName="message" rows="5" placeholder="Type your message..." 
        class="text-textPrimary border border-gray-600 bg-primary/90 px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-secondary transition duration-200 resize-none"></textarea>
      <span *ngIf="message?.touched && message?.invalid" class="text-red-500 text-sm mt-1">Message is required</span>
    </div>

    <div>
      <button type="submit" 
        [disabled]="isSubmitting"
        class="w-full bg-accent text-white font-semibold py-3 rounded-lg hover:bg-red-600 transition-all duration-300 shadow-md flex justify-center items-center gap-2">
        <span *ngIf="isSubmitting" class="animate-spin border-2 border-white border-t-transparent rounded-full w-5 h-5"></span>
        {{ isSubmitting ? 'Sending...' : 'Send Message' }}
      </button>
    </div>
  </form>

  <!-- Toast -->
  <div *ngIf="showToast" 
       class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg animate-fadeInOut">
    Message sent successfully!
  </div>
</section>
