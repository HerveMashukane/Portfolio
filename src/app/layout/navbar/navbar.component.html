<!-- navbar -->
<nav class="sticky top-0 z-50 backdrop-blur-md bg-primary/90 shadow-md transition-all duration-300">
  <div class="flex items-center justify-around px-6 md:px-12 py-4">
    <div class="w-10 h-10 md:w-14 md:h-14">
      <img src="/assets/images/herve.jpg" alt="Hervé Image" class="border border-secondary rounded-full">
    </div>
    <div class="md:hidden">
      <button (click)="toggleMenu()" class="text-secondary text-3xl">
        <i [ngClass]="isClicked ? 'bi bi-x' : 'bi bi-list'"></i>
      </button>
    </div>
    <div
      [ngClass]="{
        'absolute w-full left-0 top-full shadow-lg transition-transform duration-500 ease-in-out md:static md:flex md:space-x-8 md:shadow-none md:bg-transparent': true,
        'translate-y-[-100%] opacity-0 pointer-events-none': !isClicked && isSmallScreen,
        'translate-y-0 backdrop-blur-md bg-primary/95 pointer-events-auto': isClicked && isSmallScreen
      }"
      class="flex flex-col md:flex-row md:items-center md:justify-center md:space-y-0 space-y-4 p-6 md:p-0 text-textPrimary">
      
      <a (click)="scrollToSection(homeSection); autoCloseMenu()" class="group relative font-bold cursor-pointer transition-colors duration-300 hover:text-secondary">
        Home
        <span class="absolute left-0 bottom-0 h-0.5 w-0 bg-secondary transition-all group-hover:w-full"></span>
      </a>
      <a (click)="scrollToSection(aboutSection); autoCloseMenu()" class="group relative font-bold cursor-pointer transition-colors duration-300 hover:text-secondary">
        About
        <span class="absolute left-0 bottom-0 h-0.5 w-0 bg-secondary transition-all group-hover:w-full"></span>
      </a>
      <a (click)="scrollToSection(skillsSection); autoCloseMenu()" class="group relative font-bold cursor-pointer transition-colors duration-300 hover:text-secondary">
        Skills
        <span class="absolute left-0 bottom-0 h-0.5 w-0 bg-secondary transition-all group-hover:w-full"></span>
      </a>
      <a (click)="scrollToSection(projectsSection); autoCloseMenu()" class="group relative font-bold cursor-pointer transition-colors duration-300 hover:text-secondary">
        Projects
        <span class="absolute left-0 bottom-0 h-0.5 w-0 bg-secondary transition-all group-hover:w-full"></span>
      </a>
      <a (click)="scrollToSection(contactSection); autoCloseMenu()" class="group relative font-bold cursor-pointer transition-colors duration-300 hover:text-secondary">
        Contact
        <span class="absolute left-0 bottom-0 h-0.5 w-0 bg-secondary transition-all group-hover:w-full"></span>
      </a>
    </div>

    <!-- social media -->
    <div class="flex gap-6 text-xl text-textPrimary">
      <a href="https://www.linkedin.com/in/herv%C3%A9-mashukane-9b104b304/" target="_blank" class="hover:-translate-y-1 transition-transform"><i class="bi bi-linkedin"></i></a>
      <a href="mailto:hervemashukane@gmail.com" class="hover:-translate-y-1 transition-transform"><i class="bi bi-envelope-fill"></i></a>
      <a href="https://github.com/HerveMashukane" target="_blank" class="hover:-translate-y-1 transition-transform"><i class="bi bi-github"></i></a>
    </div>
  </div>
</nav>
