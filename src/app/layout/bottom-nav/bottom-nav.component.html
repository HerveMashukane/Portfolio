<nav class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 z-50 md:hidden">
  <div class="flex items-center justify-around h-16 px-2">
    <!-- Home -->
    <a
      [routerLink]="['/']"
      routerLinkActive="text-yellow-600 dark:text-yellow-500"
      class="flex flex-col items-center justify-center flex-1 h-full transition-colors"
      [class.text-yellow-600]="isActive('/') && router.url === '/'"
      [class.dark:text-yellow-500]="isActive('/') && router.url === '/'"
    >
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
      </svg>
      <span class="text-xs font-medium">Home</span>
    </a>

    <!-- Shop/Gallery -->
    <a
      [routerLink]="['/gallery']"
      routerLinkActive="text-yellow-600 dark:text-yellow-500"
      class="flex flex-col items-center justify-center flex-1 h-full transition-colors"
      [class.text-yellow-600]="isActive('/gallery')"
      [class.dark:text-yellow-500]="isActive('/gallery')"
    >
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
      </svg>
      <span class="text-xs font-medium">Shop</span>
    </a>

    <!-- Cart -->
    <a
      [routerLink]="['/cart']"
      routerLinkActive="text-yellow-600 dark:text-yellow-500"
      class="flex flex-col items-center justify-center flex-1 h-full transition-colors relative"
      [class.text-yellow-600]="isActive('/cart')"
      [class.dark:text-yellow-500]="isActive('/cart')"
    >
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path>
      </svg>
      <span class="text-xs font-medium">Cart</span>
      <span
        *ngIf="(cartCount$ | async) as count"
        [class.hidden]="count === 0"
        class="absolute top-0 right-4 bg-red-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full min-w-[18px] text-center"
      >
        {{ count }}
      </span>
    </a>

    <!-- Orders (Cart page for now) -->
    <a
      [routerLink]="['/faqs']"
      routerLinkActive="text-yellow-600 dark:text-yellow-500"
      class="flex flex-col items-center justify-center flex-1 h-full transition-colors"
      [class.text-yellow-600]="isActive('/faqs')"
      [class.dark:text-yellow-500]="isActive('/faqs')"
    >
      <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M18.364 5.636a9 9 0 11-12.728 0 9 9 0 0112.728 0zM12 8v4m0 4h.01"
        ></path>
      </svg>
      <span class="text-xs font-medium">Support</span>
    </a>
  </div>
</nav>
